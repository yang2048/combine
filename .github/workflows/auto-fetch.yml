name: 自动双源无损强行合并-第二个仓库

on:
  # schedule:
    # - cron: '43 0,12 * * *'
  workflow_dispatch: 

permissions: write-all

jobs:
  fetch-and-sync:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout own repo
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0 # 拉取完整提交历史，防止 pull 冲突

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 1. 抓取上游底包文件 (根据第二个仓库的需求调整 curl 地址)
    - name: Fetch target files
      run: |
        mkdir -p datas
        curl -L "https://cnb.cool/fish2035/xs/-/git/raw/main/api.json" -o datas/cnb.json
        curl -L "https://raw.githubusercontent.com/FGBLH/HKL/refs/heads/main/ok%E6%B5%B7%E8%B1%9A.json" -o datas/haitun.json
        curl -L "https://gh-proxy.com/https://raw.githubusercontent.com/ediart/tvbox/refs/heads/main/lz/py.json" -o datas/lz.json

    # 2. 运行 Python 编译脚本并下发 TG 通知
    - name: Text Merge JSON and Send TG Notice
      env:
        TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        pip install requests urllib3
        python modify_config.py

    # 3. 部署到 Cloudflare Pages (项目名设定为 hdys)
    - name: Publish to Cloudflare Pages
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      run: |
        npx -y wrangler pages project create hdys --production-branch=main || true
        npx -y wrangler pages deploy datas --project-name=hdys --branch=main

    # 4. 全量提交 Git 记录（保存记忆文件，确保变动通知与比对正常）
    - name: Commit and Push full changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git config --global core.quotepath false
        
        # 暂存 datas 目录
        git add datas/
        
        # 检查是否有内容变动
        if ! git diff --cached --exit-code --quiet; then
          git commit -m "Auto sync release (hdys): $(date +'%Y-%m-%d %H:%M:%S')"
          git pull origin ${{ github.ref_name }} --no-rebase --no-edit || true
          git push origin HEAD:${{ github.ref_name }}
        else
          echo "文件内容没有发生实际变化，无需更新，优雅退出。"
        fi
